name: Pigeon
options:
  bundleIdPrefix: com.jasonhenle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The app's own version, independent of PigeonOS (the app shows the device's version
    # separately). Info.plist reads these. Every iOS change bumps both together:
    # MARKETING_VERSION 0.1.N and CURRENT_PROJECT_VERSION N (a test checks they agree).
    # Then run tools/sync-pigeon-ios.sh.
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "4"
targets:
  Pigeon:
    type: application
    platform: iOS
    sources: [Pigeon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonhenle.pigeon
        PRODUCT_NAME: Pigeon
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone and iPad
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Pigeon/Info.plist
    info:
      path: Pigeon/Info.plist
      properties:
        CFBundleDisplayName: Pigeon Remote
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [Digital-7.ttf, SharpSansMedium.otf, SharpSansSemibold.otf]
        NSLocalNetworkUsageDescription: Pigeon Remote finds and controls the Pigeon devices on your home network.
        NSBonjourServices: [_pigeon._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  PigeonTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PigeonTests]
    dependencies:
      - target: Pigeon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonhenle.pigeon.tests
schemes:
  Pigeon:
    build:
      targets:
        Pigeon: all
    test:
      targets: [PigeonTests]
